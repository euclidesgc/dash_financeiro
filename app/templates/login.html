{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<h1>Entrar</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <label for="campo-login">Login</label>
  <input id="campo-login" name="login" type="text" value="{{ login }}">
  <label for="campo-senha">Senha</label>
  <input id="campo-senha" name="senha" type="password" value="">
  <button type="submit">Entrar</button>
</form>
{% endblock %}
